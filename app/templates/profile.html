{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<h2>Welcome, {{ username }}</h2>
<h3>Cookies</h3>

<!-- Таблиця для відображення кукі -->
<table>
    <tr><th>Key</th><th>Value</th><th>Action</th></tr>
    {% for key, value in cookies.items() %}
    <tr>
        <td>{{ key }}</td>
        <td>{{ value }}</td>
        <td><a href="{{ url_for('main.delete_cookie', key=key) }}">Delete</a></td>
    </tr>
    {% endfor %}
</table>

<!-- Форма для додавання кукі -->
<h3>Add Cookie</h3>
<form method="POST" action="{{ url_for('main.add_cookie') }}">
    <input type="text" name="key" placeholder="Key" required>
    <input type="text" name="value" placeholder="Value" required>
    <input type="number" name="max_age" placeholder="Max Age (seconds)" required>
    <button type="submit">Add Cookie</button>
</form>

<!-- Кнопка для видалення всіх кукі -->
<a href="{{ url_for('main.delete_all_cookies') }}">Delete All Cookies</a>

<!-- Перемикання теми -->
<h3>Theme</h3>
<a href="#" id="theme-toggle">Toggle Dark/Light Theme</a>
{% endblock %}
